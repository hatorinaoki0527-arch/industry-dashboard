name: Publish encrypted dashboard
on:
  push:
    branches: ['delivery/*']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: encrypted-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ciphertext and stage only public assets
        run: |
          node --check app.js
          node --check candles.js
          node --check daily-report.js
          node --check vault-cache.js
          node --test tests/*.test.cjs
          node -e "const v=require('./vault.json');if(v.version!==1||v.cipher!=='AES-256-GCM'||v.iterations!==600000||Object.keys(v).sort().join(',')!=='cipher,compression,data,iterations,iv,kdf,salt,version')process.exit(1)"
          if [ -d history ]; then
            node -e "const fs=require('fs');for(const f of fs.readdirSync('history')){if(!/^japan-[0-9]{4}-[0-9]{2}\\.[a-f0-9]{16}\\.json$/.test(f))throw Error('Unexpected history asset');const v=JSON.parse(fs.readFileSync('history/'+f));if(v.version!==1||v.cipher!=='AES-256-GCM'||v.iterations!==600000||Object.keys(v).sort().join(',')!=='cipher,compression,data,iterations,iv,kdf,salt,version')throw Error('Invalid ciphertext')}"
          fi
          if [ -d prices ]; then
            node -e "const fs=require('fs');for(const d of fs.readdirSync('prices')){if(!/^[a-zA-Z0-9]{2}$/.test(d))throw Error('Invalid price folder');for(const f of fs.readdirSync('prices/'+d)){if(!/^[a-zA-Z0-9]{1,12}\\.[a-f0-9]{16}\\.json$/.test(f)||!f.startsWith(d))throw Error('Unexpected price asset');const v=JSON.parse(fs.readFileSync('prices/'+d+'/'+f));if(v.version!==1||v.cipher!=='AES-256-GCM'||v.iterations!==600000||Object.keys(v).sort().join(',')!=='cipher,compression,data,iterations,iv,kdf,salt,version')throw Error('Invalid ciphertext')}}"
          fi
          mkdir site
          cp index.html app.js daily-report.js daily-report.css candles.js vault-cache.js style.css meta.js reference.js favicon.svg vault.json site/
          if [ -d history ]; then cp -R history site/; fi
          if [ -d prices ]; then cp -R prices site/; fi
      - name: Validate and stage release receipt
        run: |
          node -e "const fs=require('fs'),c=require('crypto'),r=JSON.parse(fs.readFileSync('release.json'));if(Object.keys(r).sort().join(',')!=='archiveDigest,builtAt,chinaDigest,vaultSha256,version'||r.version!==1||!(/^[a-f0-9]{64}$/.test(r.archiveDigest))||!(/^[a-f0-9]{64}$/.test(r.chinaDigest))||r.vaultSha256!==c.createHash('sha256').update(fs.readFileSync('vault.json')).digest('hex'))throw Error('Invalid release receipt')"
          cp release.json site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Remove temporary delivery branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"
