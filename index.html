<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>行业轮动仪表盘</title>

  <style>
    :root{
      --bg:#f5f7fa;
      --panel:#fff;
      --panel-soft:#f8fafc;
      --text:#172033;
      --muted:#687386;
      --line:#e4e9f0;
      --accent:#2457d6;
      --accent-soft:#edf3ff;
      --up:#d9363e;
      --up-soft:#fff0f0;
      --down:#159447;
      --down-soft:#edf9f1;
      --neutral:#7a8495;
      --shadow:0 10px 28px rgba(21,35,60,.06);
      --radius:14px;
    }

    *{box-sizing:border-box}

    html{
      min-width:320px;
      background:var(--bg);
    }

    body{
      margin:0;
      color:var(--text);
      background:var(--bg);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        Arial,
        sans-serif;
      line-height:1.5;
    }

    button,input{font:inherit}
    button{color:inherit}

    .page{
      width:min(1500px,100%);
      margin:0 auto;
      padding:28px 24px 40px;
    }

    .page-header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;
      margin-bottom:22px;
    }

    .title-group h1{
      margin:0;
      font-size:clamp(24px,3vw,34px);
      line-height:1.2;
    }

    .title-group p{
      margin:7px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .market-tabs{
      display:inline-flex;
      gap:6px;
      padding:5px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--panel);
      box-shadow:0 4px 16px rgba(21,35,60,.04);
    }

    .market-tab{
      min-height:40px;
      padding:8px 15px;
      border:0;
      border-radius:9px;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      font-weight:700;
      white-space:nowrap;
    }

    .market-tab:hover{
      color:var(--text);
      background:var(--panel-soft);
    }

    .market-tab.active{
      color:var(--accent);
      background:var(--accent-soft);
    }

    .market-view[hidden]{
      display:none!important;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(6,minmax(0,1fr));
      gap:12px;
      margin-bottom:16px;
    }

    .summary-card{
      min-width:0;
      min-height:104px;
      padding:16px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--panel);
      box-shadow:var(--shadow);
    }

    .summary-label{
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }

    .summary-value{
      display:flex;
      align-items:baseline;
      gap:6px;
      min-width:0;
      margin-top:10px;
      font-size:20px;
      font-weight:800;
      line-height:1.25;
    }

    .summary-value.industry-result{
      display:block;
      overflow:hidden;
      font-size:16px;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .summary-detail{
      display:block;
      margin-top:4px;
      font-size:13px;
      font-weight:800;
    }

    .up{color:var(--up)!important}
    .down{color:var(--down)!important}
    .neutral{color:var(--neutral)!important}

    .table-panel{
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--panel);
      box-shadow:var(--shadow);
    }

    .table-toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
    }

    .search-wrap{
      position:relative;
      width:min(360px,100%);
    }

    .search-icon{
      position:absolute;
      top:50%;
      left:13px;
      color:var(--muted);
      pointer-events:none;
      transform:translateY(-50%);
    }

    .search-input{
      width:100%;
      height:42px;
      padding:9px 13px 9px 38px;
      border:1px solid var(--line);
      border-radius:10px;
      outline:none;
      background:var(--panel-soft);
      color:var(--text);
    }

    .search-input:focus{
      border-color:rgba(36,87,214,.55);
      background:#fff;
      box-shadow:0 0 0 3px rgba(36,87,214,.1);
    }

    .row-count{
      flex:0 0 auto;
      color:var(--muted);
      font-size:13px;
    }

    .table-scroll{
      overflow-x:auto;
    }

    table{
      width:100%;
      min-width:1160px;
      border-collapse:separate;
      border-spacing:0;
      font-variant-numeric:tabular-nums;
    }

    thead th{
      position:sticky;
      top:0;
      z-index:2;
      padding:0;
      border-bottom:1px solid var(--line);
      background:#f8fafc;
      color:#536075;
      text-align:right;
      white-space:nowrap;
    }

    thead th:first-child{
      text-align:left;
    }

    .sort-button{
      display:inline-flex;
      align-items:center;
      justify-content:flex-end;
      gap:5px;
      width:100%;
      min-height:48px;
      padding:11px 12px;
      border:0;
      background:transparent;
      color:inherit;
      cursor:pointer;
      font-size:12px;
      font-weight:800;
      text-align:inherit;
    }

    thead th:first-child .sort-button{
      justify-content:flex-start;
      padding-left:16px;
    }

    .sort-button:hover{
      color:var(--accent);
      background:rgba(36,87,214,.04);
    }

    .sort-mark{
      display:inline-block;
      width:12px;
      color:#a2aaba;
      font-size:10px;
      text-align:center;
    }

    tbody td{
      height:55px;
      padding:11px 12px;
      border-bottom:1px solid #edf0f4;
      background:#fff;
      text-align:right;
      white-space:nowrap;
    }

    tbody td:first-child{
      padding-left:16px;
      text-align:left;
    }

    tbody tr:last-child td{
      border-bottom:0;
    }

    tbody tr:hover td{
      background:#fafcff;
    }

    .industry-name{
      font-weight:800;
    }

    .industry-name small{
      display:block;
      margin-top:2px;
      color:var(--muted);
      font-size:11px;
      font-weight:500;
    }

    .rank-cell{
      font-weight:800;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:26px;
      padding:3px 9px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
    }

    .badge-up{
      color:var(--up);
      background:var(--up-soft);
    }

    .badge-down{
      color:var(--down);
      background:var(--down-soft);
    }

    .badge-neutral{
      color:var(--neutral);
      background:#f0f2f5;
    }

    .empty-state{
      display:grid;
      min-height:310px;
      padding:36px 20px;
      place-items:center;
      text-align:center;
    }

    .empty-state-inner{
      max-width:520px;
    }

    .empty-icon{
      display:grid;
      width:54px;
      height:54px;
      margin:0 auto 15px;
      border-radius:50%;
      background:var(--accent-soft);
      color:var(--accent);
      font-size:26px;
      font-weight:800;
      place-items:center;
    }

    .empty-state h2{
      margin:0;
      font-size:20px;
    }

    .empty-state p{
      margin:9px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .other-market-empty{
      min-height:420px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--panel);
      box-shadow:var(--shadow);
    }

    .data-error{
      color:var(--down);
    }

    @media(max-width:1180px){
      .summary-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
      }
    }

    @media(max-width:760px){
      .page{
        padding:18px 12px 28px;
      }

      .page-header{
        align-items:stretch;
        flex-direction:column;
        margin-bottom:16px;
      }

      .market-tabs{
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        width:100%;
      }

      .market-tab{
        min-width:0;
        padding:8px 6px;
        font-size:13px;
      }

      .summary-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:9px;
      }

      .summary-card{
        min-height:96px;
        padding:13px;
      }

      .summary-value{
        font-size:18px;
      }

      .table-toolbar{
        align-items:stretch;
        flex-direction:column;
        gap:9px;
      }

      .search-wrap{
        width:100%;
      }
    }

    @media(max-width:420px){
      .summary-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="page-header">
      <div class="title-group">
        <h1>行业轮动仪表盘</h1>
        <p>日本市场 · 东证33行业</p>
      </div>

      <nav class="market-tabs" aria-label="市场选择">
        <button class="market-tab" type="button" data-market="china">
          中国A股
        </button>

        <button class="market-tab active" type="button" data-market="japan">
          日本市场
        </button>

        <button class="market-tab" type="button" data-market="usa">
          美国市场
        </button>
      </nav>
    </header>

    <section class="market-view" data-view="japan">

      <div id="japan-content" hidden>

        <section class="summary-grid">

          <article class="summary-card">
            <div class="summary-label">观测日期</div>
            <div class="summary-value" id="summary-date">—</div>
          </article>

          <article class="summary-card">
            <div class="summary-label">行业覆盖</div>
            <div class="summary-value" id="summary-coverage">—</div>
          </article>

          <article class="summary-card">
            <div class="summary-label">33行业平均涨跌</div>
            <div class="summary-value" id="summary-average">—</div>
          </article>

          <article class="summary-card">
            <div class="summary-label">强势 / 弱势</div>
            <div class="summary-value">
              <span id="summary-strong" class="up">—</span>
              <span class="neutral">/</span>
              <span id="summary-weak" class="down">—</span>
            </div>
          </article>

          <article class="summary-card">
            <div class="summary-label">最强行业</div>
            <div class="summary-value industry-result" id="summary-best-name">—</div>
            <span class="summary-detail" id="summary-best-value">—</span>
          </article>

          <article class="summary-card">
            <div class="summary-label">最弱行业</div>
            <div class="summary-value industry-result" id="summary-worst-name">—</div>
            <span class="summary-detail" id="summary-worst-value">—</span>
          </article>

        </section>

        <section class="table-panel">

          <div class="table-toolbar">

            <label class="search-wrap">
              <span class="search-icon">⌕</span>

              <input
                class="search-input"
                id="industry-search"
                type="search"
                placeholder="搜索行业"
                autocomplete="off"
              >
            </label>

            <div class="row-count" id="row-count">
              共 0 个行业
            </div>

          </div>

          <div class="table-scroll">

            <table>

              <thead>
                <tr>

                  <th data-column="industry">
                    <button class="sort-button" data-sort="industry">
                      行业 <span class="sort-mark">↕</span>
                    </button>
                  </th>

                  <th data-column="indexValue">
                    <button class="sort-button" data-sort="indexValue">
                      指数值 <span class="sort-mark">↕</span>
                    </button>
                  </th>

                  <th data-column="today">
                    <button class="sort-button" data-sort="today">
                      今日 <span class="sort-mark">↕</span>
                    </button>
                  </th>

                  <th data-column="rs">
                    <button class="sort-button" data-sort="rs">
                      RS <span class="sort-mark">↕</span>
                    </button>
                  </th>

                  <th data-column="return5">
                    <button class="sort-button" data-sort="return5">
                      5日 <span class="sort-mark">↕</span>
                    </button>
                  </th>

                  <th data-column="return20">
                    <button class="sort-button" data-sort="return20">
                      20日 <span class="sort-mark">↕</span>
                    </button>
                  </th>

                  <th data-column="rank">
                    <button class="sort-button" data-sort="rank">
                      当日排名 <span class="sort-mark">↑</span>
                    </button>
                  </th>

                  <th data-column="rankChange">
                    <button class="sort-button" data-sort="rankChange">
                      排名变化 <span class="sort-mark">↕</span>
                    </button>
                  </th>

                  <th data-column="rotation">
                    <button class="sort-button" data-sort="rotation">
                      轮动 <span class="sort-mark">↕</span>
                    </button>
                  </th>

                  <th data-column="streakSort">
                    <button class="sort-button" data-sort="streakSort">
                      连续状态 <span class="sort-mark">↕</span>
                    </button>
                  </th>

                </tr>
              </thead>

              <tbody id="industry-table-body"></tbody>

            </table>

          </div>
        </section>
      </div>

      <section class="table-panel empty-state" id="japan-empty">

        <div class="empty-state-inner">

          <div class="empty-icon">!</div>

          <h2>暂无数据，请先运行 Actions → Daily Update</h2>

          <p>
            Daily Update 完成后，
            页面会自动读取 embedded-data 中的真实日本市场数据。
          </p>

        </div>

      </section>

    </section>

    <section class="market-view" data-view="china" hidden>

      <div class="empty-state other-market-empty">

        <div class="empty-state-inner">

          <div class="empty-icon">—</div>

          <h2>暂无已接入数据</h2>

          <p>中国A股数据将在后续接入。</p>

        </div>

      </div>

    </section>

    <section class="market-view" data-view="usa" hidden>

      <div class="empty-state other-market-empty">

        <div class="empty-state-inner">

          <div class="empty-icon">—</div>

          <h2>暂无已接入数据</h2>

          <p>美国市场数据将在后续接入。</p>

        </div>

      </div>

    </section>

  </main>


  <script type="application/json" id="embedded-data">
{
  "summary": [],
  "rep": [],
  "act": [],
  "detail": [],
  "history": []
}
  </script>


  <script>
  (() => {

    "use strict";


    const INDUSTRY_LABELS = {

      "水産・農林業":"水产与农林",
      "鉱業":"矿业",
      "建設業":"建筑业",
      "食料品":"食品",
      "繊維製品":"纺织品",
      "パルプ・紙":"纸浆与纸",
      "化学":"化学",
      "医薬品":"医药品",
      "石油・石炭製品":"石油与煤炭制品",
      "ゴム製品":"橡胶制品",
      "ガラス・土石製品":"玻璃与土石制品",
      "鉄鋼":"钢铁",
      "非鉄金属":"有色金属",
      "金属製品":"金属制品",
      "機械":"机械",
      "電気機器":"电气设备",
      "輸送用機器":"运输设备",
      "精密機器":"精密仪器",
      "その他製品":"其他制品",
      "電気・ガス業":"电力与燃气",
      "陸運業":"陆运",
      "海運業":"海运",
      "空運業":"空运",
      "倉庫・運輸関連業":"仓储与运输相关",
      "情報・通信業":"信息与通信",
      "卸売業":"批发",
      "小売業":"零售",
      "銀行業":"银行",
      "証券業":"证券与商品期货",
      "保険業":"保险",
      "その他金融業":"其他金融",
      "不動産業":"房地产",
      "サービス業":"服务业"

    };


    const FIELD_NAMES = {

      date:[
        "日期",
        "交易日期",
        "观测日期",
        "date"
      ],

      time:[
        "时间",
        "更新时间",
        "time"
      ],

      market:[
        "市场",
        "市場",
        "market"
      ],

      taxonomy:[
        "分类体系",
        "分類体系",
        "taxonomy"
      ],

      industry:[
        "一级行业",
        "行业",
        "行业名称",
        "業種",
        "industry",
        "sector"
      ],

      indexValue:[
        "行业指数值",
        "指数值",
        "index_value",
        "indexValue"
      ],

      today:[
        "行业指数涨跌幅(%)",
        "行业指数涨跌幅",
        "涨跌幅(%)",
        "涨跌幅",
        "daily_return"
      ],

      average:[
        "33行业当日平均涨跌幅(%)",
        "33行业当日平均涨跌幅",
        "market_average"
      ],

      rs:[
        "当日相对强度(%)",
        "当日相对强度",
        "relative_strength",
        "rs"
      ],

      return5:[
        "5日收益率(%)",
        "5日收益率",
        "return_5d"
      ],

      return20:[
        "20日收益率(%)",
        "20日收益率",
        "return_20d"
      ],

      rank:[
        "当日强弱排名",
        "当日排名",
        "daily_rank",
        "rank"
      ],

      rankChange:[
        "排名变化",
        "rank_change"
      ],

      strongDays:[
        "连续强势天数",
        "strong_streak"
      ],

      weakDays:[
        "连续弱势天数",
        "weak_streak"
      ],

      rotation:[
        "轮动状态",
        "rotation_status"
      ]

    };


    const state = {

      rows:[],
      query:"",
      sortKey:"rank",
      sortDirection:"asc",
      latestDate:"",
      latestTime:""

    };


    const elements = {

      content:document.getElementById("japan-content"),
      empty:document.getElementById("japan-empty"),
      tbody:document.getElementById("industry-table-body"),
      search:document.getElementById("industry-search"),
      rowCount:document.getElementById("row-count"),

      date:document.getElementById("summary-date"),
      coverage:document.getElementById("summary-coverage"),
      average:document.getElementById("summary-average"),

      strong:document.getElementById("summary-strong"),
      weak:document.getElementById("summary-weak"),

      bestName:document.getElementById("summary-best-name"),
      bestValue:document.getElementById("summary-best-value"),

      worstName:document.getElementById("summary-worst-name"),
      worstValue:document.getElementById("summary-worst-value")

    };


    function normalizeKey(value){

      return String(value ?? "")
        .normalize("NFKC")
        .trim()
        .toLowerCase()
        .replace(/\(\s*%\s*\)/g,"")
        .replace(/[％%]/g,"")
        .replace(/[\s_-]+/g,"");

    }


    function getField(record,candidates){

      if(!record || typeof record!=="object"){
        return null;
      }

      for(const candidate of candidates){

        if(
          Object.prototype.hasOwnProperty.call(record,candidate) &&
          record[candidate]!==undefined &&
          record[candidate]!==null &&
          record[candidate]!==""
        ){
          return record[candidate];
        }

      }

      const normalizedCandidates =
        new Set(candidates.map(normalizeKey));

      for(const [key,value] of Object.entries(record)){

        if(
          normalizedCandidates.has(normalizeKey(key)) &&
          value!==undefined &&
          value!==null &&
          value!==""
        ){
          return value;
        }

      }

      return null;

    }


    function toNumber(value){

      if(typeof value==="number"){
        return Number.isFinite(value) ? value : null;
      }

      if(value===null || value===undefined){
        return null;
      }

      let text=String(value)
        .normalize("NFKC")
        .trim()
        .replace(/[,\s]/g,"")
        .replace(/[％%]/g,"")
        .replace(/−/g,"-");

      if(
        text==="" ||
        /^(?:—|–|-|--|n\/a|na|null|none|nan)$/i.test(text)
      ){
        return null;
      }

      const parsed=Number(text);

      return Number.isFinite(parsed)
        ? parsed
        : null;

    }


    function cleanText(value){

      if(value===null || value===undefined){
        return "";
      }

      const text=String(value).trim();

      if(
        !text ||
        /^(?:—|–|-|--|n\/a|na|null|none|nan)$/i.test(text)
      ){
        return "";
      }

      return text;

    }


    function canonicalIndustry(value){

      let name=cleanText(value)
        .normalize("NFKC")
        .replace(/\s+/g,"");

      if(!name){
        return "";
      }

      if(
        name==="証券業" ||
        name==="证券业" ||
        name==="证券与商品期货" ||
        name==="證券與商品期貨" ||
        name==="証券、商品先物取引業"
      ){
        return "証券業";
      }

      return name;

    }


    function industryDisplayName(name){

      return INDUSTRY_LABELS[name] || name || "—";

    }


    function isJapanRecord(record){

      const industry=
        getField(record,FIELD_NAMES.industry);

      if(!cleanText(industry)){
        return false;
      }

      const market=
        cleanText(getField(record,FIELD_NAMES.market));

      const taxonomy=
        cleanText(getField(record,FIELD_NAMES.taxonomy));

      if(market){
        return /日本|japan|jp/i.test(market);
      }

      if(taxonomy){
        return /东证|東証|topix\s*33/i.test(taxonomy);
      }

      return true;

    }


    function dateKey(value){

      const text=
        cleanText(value).normalize("NFKC");

      if(!text){
        return "";
      }

      const match=text.match(
        /(\d{4})[年./-](\d{1,2})[月./-](\d{1,2})/
      );

      if(match){

        return [
          match[1],
          match[2].padStart(2,"0"),
          match[3].padStart(2,"0")
        ].join("");

      }

      return text.replace(/[^\d]/g,"");

    }


    function displayDate(value){

      const text=
        cleanText(value).normalize("NFKC");

      if(!text){
        return "—";
      }

      const match=text.match(
        /(\d{4})[年./-](\d{1,2})[月./-](\d{1,2})/
      );

      if(!match){
        return text;
      }

      return [
        match[1],
        match[2].padStart(2,"0"),
        match[3].padStart(2,"0")
      ].join("-");

    }


    function parseEmbeddedData(){

      const script=
        document.getElementById("embedded-data");

      if(!script){
        return {rows:[],error:true};
      }

      try{

        const parsed=
          JSON.parse(script.textContent.trim() || "{}");

        const summary=
          Array.isArray(parsed.summary)
            ? parsed.summary
            : [];

        const japanRecords=
          summary.filter(isJapanRecord);

        if(!japanRecords.length){
          return {rows:[],error:false};
        }

        let latest="";

        japanRecords.forEach(record=>{

          const key=
            dateKey(getField(record,FIELD_NAMES.date));

          if(key>latest){
            latest=key;
          }

        });

        const latestRecords=
          japanRecords.filter(record=>
            dateKey(getField(record,FIELD_NAMES.date))===latest
          );


        const map=new Map();


        latestRecords.forEach(record=>{

          const canonical=
            canonicalIndustry(
              getField(record,FIELD_NAMES.industry)
            );

          if(!canonical){
            return;
          }


          const strongDays=
            toNumber(
              getField(record,FIELD_NAMES.strongDays)
            );

          const weakDays=
            toNumber(
              getField(record,FIELD_NAMES.weakDays)
            );


          const row={

            canonical,
            industry:industryDisplayName(canonical),

            date:cleanText(
              getField(record,FIELD_NAMES.date)
            ),

            time:cleanText(
              getField(record,FIELD_NAMES.time)
            ),

            indexValue:
              toNumber(
                getField(record,FIELD_NAMES.indexValue)
              ),

            today:
              toNumber(
                getField(record,FIELD_NAMES.today)
              ),

            average:
              toNumber(
                getField(record,FIELD_NAMES.average)
              ),

            rs:
              toNumber(
                getField(record,FIELD_NAMES.rs)
              ),

            return5:
              toNumber(
                getField(record,FIELD_NAMES.return5)
              ),

            return20:
              toNumber(
                getField(record,FIELD_NAMES.return20)
              ),

            rank:
              toNumber(
                getField(record,FIELD_NAMES.rank)
              ),

            rankChange:
              toNumber(
                getField(record,FIELD_NAMES.rankChange)
              ),

            strongDays,
            weakDays,

            rotation:
              cleanText(
                getField(record,FIELD_NAMES.rotation)
              )

          };


          if(
            strongDays!==null &&
            strongDays>0
          ){
            row.streakSort=strongDays;
          }
          else if(
            weakDays!==null &&
            weakDays>0
          ){
            row.streakSort=-weakDays;
          }
          else{
            row.streakSort=null;
          }


          const existing=
            map.get(canonical);


          if(!existing){

            map.set(canonical,row);

          }
          else{

            Object.keys(row).forEach(key=>{

              if(
                (
                  existing[key]===null ||
                  existing[key]===undefined ||
                  existing[key]===""
                ) &&
                row[key]!==null &&
                row[key]!==undefined &&
                row[key]!==""
              ){
                existing[key]=row[key];
              }

            });

          }

        });


        const rows=
          Array.from(map.values());


        return {

          rows,
          error:false,

          latestDate:
            rows.find(row=>row.date)?.date || "",

          latestTime:
            rows.find(row=>row.time)?.time || ""

        };

      }
      catch(error){

        console.error(error);

        return {
          rows:[],
          error:true
        };

      }

    }


    function formatIndex(value){

      if(value===null || value===undefined){
        return "—";
      }

      return new Intl.NumberFormat(
        "zh-CN",
        {
          minimumFractionDigits:2,
          maximumFractionDigits:2
        }
      ).format(value);

    }


    function formatPercent(value){

      if(value===null || value===undefined){
        return "—";
      }

      const prefix=value>0 ? "+" : "";

      return prefix+value.toFixed(2)+"%";

    }


    function formatRank(value){

      if(value===null || value===undefined){
        return "—";
      }

      return String(Math.round(value));

    }


    function formatRankChange(value){

      if(value===null || value===undefined){
        return "—";
      }

      const rounded=Math.round(value);

      if(rounded>0){
        return "↑ "+rounded;
      }

      if(rounded<0){
        return "↓ "+Math.abs(rounded);
      }

      return "→";

    }


    function valueClass(value){

      if(value===null || value===undefined || value===0){
        return "neutral";
      }

      return value>0
        ? "up"
        : "down";

    }


    function rotationClass(value){

      const text=
        cleanText(value);

      if(
        text==="强势延续" ||
        text==="转强"
      ){
        return "badge badge-up";
      }

      if(
        text==="弱势延续" ||
        text==="转弱"
      ){
        return "badge badge-down";
      }

      return "badge badge-neutral";

    }


    function streakData(row){

      if(
        row.strongDays!==null &&
        row.strongDays>0
      ){

        return {
          text:"强 "+Math.round(row.strongDays)+"天",
          className:"badge badge-up"
        };

      }

      if(
        row.weakDays!==null &&
        row.weakDays>0
      ){

        return {
          text:"弱 "+Math.round(row.weakDays)+"天",
          className:"badge badge-down"
        };

      }

      return {
        text:"—",
        className:"neutral"
      };

    }


    function createCell(text,className=""){

      const cell=
        document.createElement("td");

      cell.textContent=text;

      if(className){
        cell.className=className;
      }

      return cell;

    }


    function createIndustryCell(row){

      const cell=
        document.createElement("td");

      const main=
        document.createElement("div");

      main.className="industry-name";
      main.textContent=row.industry;


      const small=
        document.createElement("small");

      small.textContent=row.canonical;


      main.appendChild(small);
      cell.appendChild(main);

      return cell;

    }


    function createBadgeCell(text,className){

      const cell=
        document.createElement("td");


      if(text==="—"){

        cell.textContent="—";
        cell.className="neutral";

        return cell;

      }


      const badge=
        document.createElement("span");

      badge.className=className;
      badge.textContent=text;

      cell.appendChild(badge);

      return cell;

    }


    function getVisibleRows(){

      const query=
        state.query
          .trim()
          .toLocaleLowerCase("zh-CN");


      const filtered=
        query
          ? state.rows.filter(row=>{

              const searchable=[
                row.industry,
                row.canonical,
                row.rotation
              ]
              .join(" ")
              .toLocaleLowerCase("zh-CN");

              return searchable.includes(query);

            })
          : [...state.rows];


      const direction=
        state.sortDirection==="asc"
          ? 1
          : -1;


      const key=
        state.sortKey;


      filtered.sort((a,b)=>{

        const av=a[key];
        const bv=b[key];


        const am=
          av===null ||
          av===undefined ||
          av==="";

        const bm=
          bv===null ||
          bv===undefined ||
          bv==="";


        if(am && bm){
          return a.industry.localeCompare(
            b.industry,
            "zh-CN"
          );
        }

        if(am){
          return 1;
        }

        if(bm){
          return -1;
        }


        if(
          typeof av==="number" &&
          typeof bv==="number"
        ){

          if(av===bv){

            return a.industry.localeCompare(
              b.industry,
              "zh-CN"
            );

          }

          return (av-bv)*direction;

        }


        return String(av)
          .localeCompare(
            String(bv),
            "zh-CN",
            {
              numeric:true,
              sensitivity:"base"
            }
          )*direction;

      });


      return filtered;

    }


    function renderTable(){

      const rows=
        getVisibleRows();


      elements.tbody
        .replaceChildren();


      rows.forEach(row=>{

        const tr=
          document.createElement("tr");


        tr.appendChild(
          createIndustryCell(row)
        );


        tr.appendChild(
          createCell(
            formatIndex(row.indexValue)
          )
        );


        tr.appendChild(
          createCell(
            formatPercent(row.today),
            valueClass(row.today)
          )
        );


        tr.appendChild(
          createCell(
            formatPercent(row.rs),
            valueClass(row.rs)
          )
        );


        tr.appendChild(
          createCell(
            formatPercent(row.return5),
            valueClass(row.return5)
          )
        );


        tr.appendChild(
          createCell(
            formatPercent(row.return20),
            valueClass(row.return20)
          )
        );


        tr.appendChild(
          createCell(
            formatRank(row.rank),
            "rank-cell"
          )
        );


        tr.appendChild(
          createCell(
            formatRankChange(row.rankChange),
            valueClass(row.rankChange)
          )
        );


        tr.appendChild(
          createBadgeCell(
            row.rotation || "—",
            rotationClass(row.rotation)
          )
        );


        const streak=
          streakData(row);


        tr.appendChild(
          createBadgeCell(
            streak.text,
            streak.className
          )
        );


        elements.tbody
          .appendChild(tr);

      });


      elements.rowCount.textContent=
        state.query
          ? `显示 ${rows.length} / ${state.rows.length} 个行业`
          : `共 ${state.rows.length} 个行业`;


      updateSortIndicators();

    }


    function setMetricElement(
      element,
      text,
      numericValue=null
    ){

      element.textContent=text;

      element.classList.remove(
        "up",
        "down",
        "neutral"
      );


      if(
        numericValue===null ||
        numericValue===undefined
      ){
        element.classList.add("neutral");
      }
      else{
        element.classList.add(
          valueClass(numericValue)
        );
      }

    }


    function renderSummary(){

      const rows=
        state.rows;


      const dateText=
        displayDate(
          state.latestDate
        );


      const timeText=
        cleanText(
          state.latestTime
        );


      elements.date.textContent=
        dateText==="—"
          ? "—"
          : timeText
            ? `${dateText} ${timeText}`
            : dateText;


      elements.coverage.textContent=
        `${rows.length} / 33`;


      const explicitAverage=
        rows
        .map(row=>row.average)
        .find(
          value=>
            value!==null &&
            value!==undefined
        );


      const validToday=
        rows
        .map(row=>row.today)
        .filter(
          value=>
            value!==null &&
            value!==undefined
        );


      const calculatedAverage=
        validToday.length
          ? validToday.reduce(
              (sum,value)=>sum+value,
              0
            )/validToday.length
          : null;


      const average=
        explicitAverage!==undefined &&
        explicitAverage!==null
          ? explicitAverage
          : calculatedAverage;


      setMetricElement(
        elements.average,
        formatPercent(average),
        average
      );


      const rowsWithRS=
        rows.filter(
          row=>
            row.rs!==null &&
            row.rs!==undefined
        );


      let strongCount=0;
      let weakCount=0;


      if(rowsWithRS.length){

        strongCount=
          rowsWithRS.filter(
            row=>row.rs>0
          ).length;

        weakCount=
          rowsWithRS.filter(
            row=>row.rs<0
          ).length;

      }
      else if(average!==null){

        strongCount=
          rows.filter(
            row=>
              row.today!==null &&
              row.today>average
          ).length;

        weakCount=
          rows.filter(
            row=>
              row.today!==null &&
              row.today<average
          ).length;

      }


      elements.strong.textContent=
        "强 "+strongCount;

      elements.weak.textContent=
        "弱 "+weakCount;


      const validPerformance=
        rows.filter(
          row=>
            row.today!==null &&
            row.today!==undefined
        );


      if(!validPerformance.length){

        elements.bestName.textContent="—";
        elements.worstName.textContent="—";

        setMetricElement(
          elements.bestValue,
          "—"
        );

        setMetricElement(
          elements.worstValue,
          "—"
        );

        return;

      }


      const best=
        validPerformance.reduce(
          (current,row)=>
            row.today>current.today
              ? row
              : current
        );


      const worst=
        validPerformance.reduce(
          (current,row)=>
            row.today<current.today
              ? row
              : current
        );


      elements.bestName.textContent=
        best.industry;

      elements.worstName.textContent=
        worst.industry;


      setMetricElement(
        elements.bestValue,
        formatPercent(best.today),
        best.today
      );


      setMetricElement(
        elements.worstValue,
        formatPercent(worst.today),
        worst.today
      );

    }


    function updateSortIndicators(){

      document
        .querySelectorAll(
          "th[data-column]"
        )
        .forEach(th=>{

          const key=
            th.dataset.column;

          const mark=
            th.querySelector(
              ".sort-mark"
            );


          if(key===state.sortKey){

            mark.textContent=
              state.sortDirection==="asc"
                ? "↑"
                : "↓";

          }
          else{

            mark.textContent="↕";

          }

        });

    }


    function showJapanEmpty(isError){

      elements.content.hidden=true;
      elements.empty.hidden=false;


      if(isError){

        const title=
          elements.empty.querySelector("h2");

        const description=
          elements.empty.querySelector("p");


        title.textContent=
          "embedded-data 读取失败";

        title.classList.add(
          "data-error"
        );


        description.textContent=
          "请检查 embedded-data 是否为有效 JSON，然后重新运行 Daily Update。";

      }

    }


    function showJapanContent(){

      elements.empty.hidden=true;
      elements.content.hidden=false;

    }


    function bindTabs(){

      const tabs=
        document.querySelectorAll(
          ".market-tab"
        );

      const views=
        document.querySelectorAll(
          ".market-view"
        );


      tabs.forEach(tab=>{

        tab.addEventListener(
          "click",
          ()=>{

            const market=
              tab.dataset.market;


            tabs.forEach(item=>{

              item.classList.toggle(
                "active",
                item===tab
              );

            });


            views.forEach(view=>{

              view.hidden=
                view.dataset.view!==market;

            });

          }
        );

      });

    }


    function bindSorting(){

      document
        .querySelectorAll(
          "[data-sort]"
        )
        .forEach(button=>{

          button.addEventListener(
            "click",
            ()=>{

              const key=
                button.dataset.sort;


              if(state.sortKey===key){

                state.sortDirection=
                  state.sortDirection==="asc"
                    ? "desc"
                    : "asc";

              }
              else{

                state.sortKey=key;

                state.sortDirection=
                  key==="rank" ||
                  key==="industry"
                    ? "asc"
                    : "desc";

              }


              renderTable();

            }
          );

        });

    }


    function bindSearch(){

      elements.search
        .addEventListener(
          "input",
          event=>{

            state.query=
              event.target.value || "";

            renderTable();

          }
        );

    }


    function initialize(){

      bindTabs();
      bindSorting();
      bindSearch();


      const result=
        parseEmbeddedData();


      if(
        result.error ||
        !result.rows.length
      ){

        showJapanEmpty(
          result.error
        );

        return;

      }


      state.rows=
        result.rows;

      state.latestDate=
        result.latestDate || "";

      state.latestTime=
        result.latestTime || "";


      showJapanContent();

      renderSummary();

      renderTable();

    }


    initialize();

  })();
  </script>
